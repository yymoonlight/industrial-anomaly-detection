[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "results", ".cache", ".test_tmp"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: 端到端冒烟测试（CPU 上约 20-30 秒，首次运行需下载预训练权重）",
]
