# ============================================================
# 阶段三：PatchCore vs EfficientAD 多类别对比矩阵
# 运行：python -m src.experiments.matrix --config configs/stage3_matrix.yaml
#   或  bash scripts/run_stage3.sh
# 说明：resume=true 时，已在 results/experiments.csv 中的 (模型,类别) 自动跳过，
#       单个组合失败会记录到 results/logs/stage3_failures.csv 并继续后续组合。
# ============================================================

matrix:
  # 物体类 + 纹理类，覆盖结构件与纹理表面
  categories: [bottle, cable, metal_nut, hazelnut, grid, leather, carpet]
  models: [patchcore, efficientad]

data_root: data/mvtec_anomaly_detection
imagenet_dir: data/imagenette        # 指向 imagenette2/train（见 scripts/setup_imagenette.sh）
seed: 42

# 评估公共设置
heatmap_count: 10
eval_batch_size: 32
num_workers: 8
resume: true

# 各模型训练设置
train:
  patchcore:
    max_epochs: 1
    train_batch_size: 32
    backbone: wide_resnet50_2
    layers: [layer2, layer3]
    coreset_sampling_ratio: 0.1
    num_neighbors: 9
  efficientad:
    max_epochs: 100        # GPU 正式训练（EfficientAD 需真正迭代，收敛快、可按结果调整）
    train_batch_size: 1    # 论文设置：每步 1 张正常图 + 1 张 imagenette
    model_size: s
    teacher_out_channels: 384
    lr: 0.0001
    weight_decay: 0.00001
