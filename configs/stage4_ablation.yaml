# ============================================================
# 阶段四：PatchCore 工程消融（控制变量，逐维度扫描）+ 阈值标定
# 运行：python -m src.experiments.ablation --config configs/stage4_ablation.yaml
#   或  bash scripts/run_stage4.sh
# 原则：每次只改变一个维度，其余固定为 baseline，得到可解释的单因子影响。
# ============================================================

base:
  data_root: data/mvtec_anomaly_detection
  category: bottle
  seed: 42
  eval_batch_size: 32
  num_workers: 8
  resume: true
  baseline:
    backbone: wide_resnet50_2
    layers: [layer2, layer3]
    coreset_sampling_ratio: 0.1
    num_neighbors: 9

heatmap_count: 5

# 逐维度候选值（与 baseline 相同的值会自动去重）
sweep:
  backbone: [resnet18, resnet50, wide_resnet50_2]
  layers:
    - [layer2]
    - [layer2, layer3]
    - [layer1, layer2, layer3]
  coreset_sampling_ratio: [0.01, 0.05, 0.1, 0.25]
  num_neighbors: [1, 3, 9]

# 阈值标定（在消融 + 对比结果上批量执行）
threshold:
  recall_target: 0.99      # 漏检代价高：满足该召回下取精度最高的阈值
  precision_target: 0.95   # 误检代价高：满足该精度下取召回最高的阈值
